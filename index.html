        <h2 style="font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:1rem;letter-spacing:-.5px;">StreamEast – Free Live Sports Streaming Without Limits</h2>
        <p style="color:#bbb;line-height:1.8;font-size:.95rem;margin-bottom:2rem;">StreamEast is your premier destination for free live sports streaming in 2026, delivering high-definition coverage of every major sporting event without subscriptions, registration, or paywalls. From NFL Sunday showdowns and NBA playoff battles to Premier League football, UFC title fights, Formula 1 Grand Prix races, and Stanley Cup ice hockey, StreamEast brings you instant access to the biggest moments in sports. With multiple redundant sources, lightning-fast loading times, and a mobile-friendly interface that works flawlessly on phones, tablets, laptops, and smart TVs, StreamEast ensures you never miss a second of the action — completely free, every single day.</p>

        <h2 style="font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:1rem;letter-spacing:-.5px;">StreamEast NFL Streams – Every Down, Every Game</h2>
        <p style="color:#bbb;line-height:1.8;font-size:.95rem;margin-bottom:2rem;">Watch every NFL game live in crystal-clear HD on StreamEast — from the season opener and Thanksgiving classics to the Super Bowl and Pro Bowl. StreamEast covers all 32 teams including the Kansas City Chiefs, San Francisco 49ers, Dallas Cowboys, Philadelphia Eagles, Buffalo Bills, and Baltimore Ravens. Whether you need Monday Night Football, Thursday Night Football, Sunday Night Football, or Sunday afternoon broadcasts, StreamEast delivers reliable streams with zero buffering and no blackout restrictions. Catch every touchdown, interception, and game-winning drive completely free.</p>

        <h2 style="font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:1rem;letter-spacing:-.5px;">StreamEast NBA Streams – Live Basketball in HD</h2>
        <p style="color:#bbb;line-height:1.8;font-size:.95rem;margin-bottom:2rem;">Experience every dribble, dunk, and buzzer-beater with StreamEast NBA streams. Follow superstars like LeBron James, Stephen Curry, Giannis Antetokounmpo, Nikola Jokic, Luka Doncic, and Kevin Durant throughout the regular season, NBA Playoffs, Conference Finals, and NBA Finals. StreamEast covers all 30 franchises including the Los Angeles Lakers, Golden State Warriors, Boston Celtics, Miami Heat, Denver Nuggets, and Milwaukee Bucks. Watch NBA action in high definition on any device with no signup required.</p>

        <h2 style="font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:1rem;letter-spacing:-.5px;">StreamEast Soccer Streams – Premier League, Champions League & Global Football</h2>
        <p style="color:#bbb;line-height:1.8;font-size:.95rem;margin-bottom:2rem;">StreamEast brings you comprehensive soccer coverage from every corner of the globe. Watch the Premier League, UEFA Champions League, Europa League, La Liga, Serie A, Bundesliga, Ligue 1, MLS, Liga MX, Copa Libertadores, and international tournaments like the FIFA World Cup, UEFA European Championship, Copa America, and Africa Cup of Nations. Follow iconic clubs including Manchester City, Liverpool, Real Madrid, Barcelona, Bayern Munich, Juventus, Paris Saint-Germain, and AC Milan. StreamEast offers free HD streams for every match across all major leagues and competitions.</p>

        <h2 style="font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:1rem;letter-spacing:-.5px;">StreamEast UFC & Boxing Streams – Every Fight Night</h2>

function seInitNav() {
    window.scrollTo(0, 0);
    var burger = document.querySelector('.nav-burger');

    burger.addEventListener('click', function () {

        if (wrapper.style.display === 'none' || wrapper.style.display === '') {
            links.forEach(function(el){ el.classList.add('show-nav'); });
            mobileWrapper.classList.add('open');
            menuBtn.classList.add('close');
            wrapper.style.display = 'block';
        } else {
            links.forEach(function(el){ el.classList.remove('show-nav'); });
            mobileWrapper.classList.remove('open');

            wrapper.style.display = 'none';

document.addEventListener('DOMContentLoaded', seInitNav);

<script data-cfasync="false">
/* ── MATCHES ENGINE ── */
/* XHR-based fetch wrapper — bypasses Cloudflare Rocket Loader fetch interception */
function _nativeFetch(url) {
    return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onload = function() {
            resolve({
                ok: xhr.status >= 200 && xhr.status < 300,
                status: xhr.status,
                json: function() { return Promise.resolve(JSON.parse(xhr.responseText)); }
            });
        };
        xhr.onerror = function() { reject(new Error('Network error')); };
        xhr.ontimeout = function() { reject(new Error('Timeout')); };
        xhr.timeout = 10000;
        xhr.send();
    });
}
const SE_API_SOURCE   = 'fallback';
const SE_API_PRIMARY  = 'https://ws.kora-api.space/api/matches';
const SE_API_FALLBACK = 'https://ws.kora-api.space/api/streamed/matches';
const SE_API_MATCHES  = SE_API_SOURCE === 'fallback' ? SE_API_FALLBACK : SE_API_PRIMARY;
const SE_KORA_BASE    = 'https://ws.kora-api.space';
const SE_KORA_LOGOS   = 'https://ws.kora-api.space/uploads/logos/';

const SE_LANG_FLAGS = {
    English:'🇬🇧', Spanish:'🇪🇸', Italian:'🇮🇹', Italien:'🇮🇹',
    Deutch:'🇩🇪', French:'🇫🇷', Portuguese:'🇵🇹', Arabic:'🇸🇦',
};

/* hash → keywords that must appear in category name (case-insensitive) */
const SE_SOCCER_KEYWORDS = ['soccer','football','premier','liga','serie','bundesliga','ligue','champions','europa','mls','copa'];

const SE_FILTERS = {
    nba:    ['nba','basketball'],
    nfl:    ['nfl','football'],
    nhl:    ['nhl','hockey'],
    mlb:    ['mlb','baseball'],
    ufc:    ['ufc','mma','boxing','combat','fight'],
    soccer: SE_SOCCER_KEYWORDS,
};

let seAllMatches = [];

function seDateUTC(offset=0){
    const d = new Date();
    d.setUTCDate(d.getUTCDate() + offset);
    return d.toISOString().slice(0,10);
}

function seT(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    return `${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}`;
}

async function seFetchFromUrl(baseUrl, date){
    const r = await _nativeFetch(`${baseUrl}?t=${seT()}`);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    let matches = data.data || [];
    if(data.total > data.per_page){
        const pages = Math.ceil(data.total / data.per_page);
        const extra = await Promise.all(
            Array.from({length: pages-1}, (_,i) =>
                _nativeFetch(`${baseUrl}?date=${date}&per_page=200&page=${i+2}&t=${seT()}`).then(r=>r.json())
            )
        );
        extra.forEach(p => { matches = matches.concat(p.data || []); });
    }
    return matches;
}

async function seFetchDate(date){
    if(SE_API_SOURCE === 'auto'){
        try {
            return await seFetchFromUrl(SE_API_PRIMARY, date);
        } catch(e) {
            console.warn('Primary API failed, switching to fallback:', e.message);
            return await seFetchFromUrl(SE_API_FALLBACK, date);
        }
    }
    return await seFetchFromUrl(SE_API_MATCHES, date);
}

function seFormatTime(iso){
    if(!iso) return '—';
    const d = new Date(iso), now = new Date(), diff = d - now;
    if(isNaN(d.getTime())) return '—';
    if(diff < 0 && diff > -7200000) return 'LIVE';
    if(diff >= 0 && diff < 3600000) return `In ${Math.round(diff/60000)}m`;
    const hrs = Math.round(diff/3600000);
    if(hrs < 24) return `${hrs} hour${hrs!==1?'s':''} from now`;
    return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function seGetFilter(){
    return location.hash.replace('#','').toLowerCase();
}

function seIsSoccer(m) {
    const cat   = (m.category?.name || '').toLowerCase();
    const sport = (m.category?.sport_code || '').toLowerCase();
    /* exclude american-football from soccer detection */
    if (cat.includes('american') || sport.includes('american')) return false;
    return SE_SOCCER_KEYWORDS.some(k => cat.includes(k) || sport.includes(k));
}

function seFilterMatches(matches){
    const hash = seGetFilter();
    const keywords = SE_FILTERS[hash];
    if(!keywords) {
        /* no filter = show all except soccer only if kora has soccer data */
        if(seKoraMatches.length > 0) {
            return matches.filter(m => !seIsSoccer(m));
        }
        return matches;
    }
    return matches.filter(m => {
        const cat = (m.category?.name || '').toLowerCase();
        const sport = (m.category?.sport_code || '').toLowerCase();
        return keywords.some(k => cat.includes(k) || sport.includes(k));
    });
}

const SE_SPORT_ICONS = {
    soccer:     '⚽', football:   '🏈', basketball: '🏀', baseball:   '⚾',
    hockey:     '🏒', tennis:     '🎾', volleyball: '🏐', rugby:      '🏉',
    cricket:    '🏏', boxing:     '🥊', mma:        '🥋', ufc:        '🥋',
    wrestling:  '🤼', racing:     '🏎️', formula:    '🏎️', f1:         '🏎️',
    motogp:     '🏍️', cycling:    '🚴', golf:       '⛳', swimming:   '🏊',
    athletics:  '🏃', handball:   '🤾', badminton:  '🏸', tableten:   '🏓',
    esports:    '🎮', darts:      '🎯', snooker:    '🎱', pool:       '🎱',
};

function seGetSportIcon(sport, catName) {
    const s = sport.toLowerCase();
    const c = catName.toLowerCase();
    for (const [key, icon] of Object.entries(SE_SPORT_ICONS)) {
        if (s.includes(key) || c.includes(key)) return icon;
    }
    /* fallback by common category name words */
    if (c.includes('nba') || c.includes('basket'))   return '🏀';
    if (c.includes('nfl') || c.includes('american')) return '🏈';
    if (c.includes('nhl') || c.includes('ice'))      return '🏒';
    if (c.includes('mlb'))                           return '⚾';
    if (c.includes('ufc') || c.includes('fight'))    return '🥋';
    if (c.includes('box'))                           return '🥊';
    if (c.includes('premier') || c.includes('liga') || c.includes('serie') || c.includes('bundesliga') || c.includes('ligue') || c.includes('champion')) return '⚽';
    return '🏆';
}

function seRenderMatches(){
    const ul = document.getElementById('GelecekMaclar');
    const hash = seGetFilter();
    const filtered = seFilterMatches(seAllMatches);

    /* update active nav link */
    document.querySelectorAll('.primary-links a').forEach(a => {
        const slug = a.getAttribute('href').replace('#','');
        a.parentElement.classList.toggle('active-filter', slug === hash);
        a.style.backgroundColor = (slug === hash) ? '#930f0d' : '';
    });

    if(!filtered.length){
        const label = hash ? hash.toUpperCase() : 'today';
        ul.innerHTML = `<li style="color:#ccc;padding:20px;text-align:center;">No ${label} matches found.</li>`;
        return;
    }

    const koraSectionHtml = seKoraRender(seKoraMatches);

    ul.innerHTML = koraSectionHtml + filtered.map(m => {
        const catName  = m.category?.name || 'Other';
        const sport    = (m.category?.sport_code || m.category?.name || '').toLowerCase();
        const catColor = m.is_live ? '#e10600' : '#002D72';
        const timeStr  = m.is_live ? '<span style="color:#930f0d;font-weight:bold;display:inline-flex;align-items:center;gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:#e10600;display:inline-block;animation:se-live-dot 1.2s ease-in-out infinite;flex-shrink:0;"></span>LIVE</span>' : seFormatTime(m.begin_at);
        const icon     = seGetSportIcon(sport, catName);
        return `
<li class="f1-podium--item${m.is_live ? ' btn-live' : ''}">
    <a href="https://fastunlocker.info${SE_API_SOURCE === 'fallback' ? '/strmd-stream.html' : '/stream.html'}?id=${m.id}" class="f1-podium--link f1-bg--white" target="_blank" rel="nofollow noreferrer noopener">
        <span class="f1-podium--rank f1-bold--xs se-cat-label" style="min-width:35px;width:unset;"><span class="se-sport-icon">${icon}</span>${catName}${(m.is_popular || m.popular) ? ' <span style="font-size:10px;background:#e10600;color:#fff;border-radius:3px;padding:1px 4px;vertical-align:middle;">HOT</span>' : ''}</span>
        <span class="team-color-icon" style="background-color:${catColor}"></span>
        <span class="f1-podium--driver f1--xs MacBaslik">
            <span class="d-md-inline">${m.name}</span>
        </span>
        <span class="f1-podium-right">
            <span style="font-weight:bold;" class="f1-podium--time f1-label f1-bg--gray2 misc--label text-semi-bold">${timeStr}</span>
            <i class="icon icon-chevron-right f1-color--warmRed"></i>
        </span>
    </a>
</li>`;
    }).join('');
}

/* ── KORA SOCCER (top section) ── */
function seKoraDate() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function seKoraT() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}`;
}

async function seKoraFetch() {
    const r = await _nativeFetch(`${SE_KORA_BASE}/api/matches/${seKoraDate()}/1?t=${seKoraT()}`);
    const data = await r.json();
    const liveIds = new Set(data.live_matche_ids || []);
    return (data.matches || []).map(m => ({ ...m, is_live: liveIds.has(String(m.id)) }));
}

function seKoraRender(matches) {
    const hash = seGetFilter();
    /* only show soccer section when no filter or soccer filter active */
    const show = !hash || ['soccer','nba','nfl','nhl','mlb','ufc'].every(k => hash !== k) || hash === 'soccer';
    if (!show || !matches.length) return '';

    const rows = matches.map(m => {
        const name     = `${m.home_en || m.home} vs ${m.away_en || m.away}`;
        const league   = m.league_en || m.league || 'Soccer';
        const isLive   = m.is_live;
        const score    = m.score && m.score !== '-' ? `<span style="background:#e10600;color:#fff;font-size:11px;padding:1px 6px;border-radius:4px;margin-left:5px;">${m.score}</span>` : '';
        const timeStr  = isLive
            ? `<span style="color:#930f0d;font-weight:bold;display:inline-flex;align-items:center;gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:#e10600;display:inline-block;animation:se-live-dot 1.2s ease-in-out infinite;flex-shrink:0;"></span>LIVE</span>`
            : m.time || '';
        const homeLogo = m.home_logo ? `<img src="${SE_KORA_LOGOS}${m.home_logo}" width="20" height="20" style="vertical-align:middle;margin-right:4px;object-fit:contain;" onerror="this.style.display='none'" alt="${m.home_en}">` : '';
        const awayLogo = m.away_logo ? `<img src="${SE_KORA_LOGOS}${m.away_logo}" width="20" height="20" style="vertical-align:middle;margin-right:4px;object-fit:contain;" onerror="this.style.display='none'" alt="${m.away_en}">` : '';
        const edges    = (m.edges || []).slice(0, 6);
        const streamUrl = (m.active == '1' && m.has_channels == '1')
            ? `https://fastunlocker.info/?m=${m.id}&lang=en`
            : (edges.length && m.edge_domain ? `#` : '#');

        return `
<li class="f1-podium--item${isLive ? ' btn-live' : ''}" style="border-left:3px solid ${isLive ? '#e10600' : '#002D72'};">
    <a href="${streamUrl}" class="f1-podium--link f1-bg--white" target="_blank" rel="nofollow noreferrer noopener">
        <span class="f1-podium--rank f1-bold--xs se-cat-label" style="min-width:35px;width:unset;"><span class="se-sport-icon">⚽</span>${league}${score}</span>
        <span class="team-color-icon" style="background-color:${isLive ? '#e10600' : '#002D72'}"></span>
        <span class="f1-podium--driver f1--xs MacBaslik">
            <span class="d-md-inline">${homeLogo}${m.home_en || m.home} vs ${awayLogo}${m.away_en || m.away}</span>
        </span>
        <span class="f1-podium-right">
            <span style="font-weight:bold;" class="f1-podium--time f1-label f1-bg--gray2 misc--label text-semi-bold">${timeStr}</span>
            <i class="icon icon-chevron-right f1-color--warmRed"></i>
        </span>
    </a>
</li>`;
    }).join('');

    return `
<li style="padding:6px 0 2px;list-style:none;">
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #333;padding-bottom:4px;width:100%;">
        ⚽ Soccer — Live &amp; Upcoming
    </span>
</li>
${rows}
<li style="padding:6px 0 2px;list-style:none;">
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #333;padding-bottom:4px;width:100%;">
        🏆 All Sports
    </span>
</li>`;
}

let seKoraMatches = [];

async function seFetchAll(){
    try {
        let matches = [];
        const date0 = seDateUTC(0), date1 = seDateUTC(1);

        if(SE_API_SOURCE === 'auto'){
            try {
                const [t, tm] = await Promise.all([
                    seFetchFromUrl(SE_API_PRIMARY, date0),
                    seFetchFromUrl(SE_API_PRIMARY, date1),
                ]);
                matches = [...t, ...tm];
            } catch(e) {
                console.warn('Primary API down, switching to fallback:', e.message);
                const [t, tm] = await Promise.all([
                    seFetchFromUrl(SE_API_FALLBACK, date0),
                    seFetchFromUrl(SE_API_FALLBACK, date1),
                ]);
                matches = [...t, ...tm];
            }
        } else {
            const [t, tm] = await Promise.all([
                seFetchFromUrl(SE_API_MATCHES, date0),
                seFetchFromUrl(SE_API_MATCHES, date1),
            ]);
            matches = [...t, ...tm];
        }

        const kora = await seKoraFetch().catch(() => []);

        const now = Date.now();
        const seen = new Set();
        seAllMatches = matches.filter(m => {
            if(seen.has(m.id)) return false;
            seen.add(m.id);
            /* hide matches that started more than 8h ago and aren't live */
            if(m.begin_at && !m.is_live){
                const ts = new Date(m.begin_at).getTime();
                if(ts < now - 28800000) return false;
            }
            return true;
        }).sort((a, b) => {
            /* LIVE first, then upcoming ASC, nulls (channels) last */
            if(a.is_live !== b.is_live) return a.is_live ? -1 : 1;
            if(!a.begin_at && !b.begin_at) return 0;
            if(!a.begin_at) return 1;
            if(!b.begin_at) return -1;
            return new Date(a.begin_at) - new Date(b.begin_at);
        });
        seKoraMatches = kora;

        document.getElementById('seLoader').style.display = 'none';
        seRenderMatches();

    } catch(e) {
        /* auto-retry once after 3s before showing error */
        if (!seFetchAll._retried) {
            seFetchAll._retried = true;
            setTimeout(() => { seFetchAll._retried = false; seFetchAll(); }, 3000);
        } else {
            document.getElementById('seLoader').innerHTML = '<span style="color:#ccc;">⚠️ Could not load matches. Please refresh.</span>';
        }
    }
}

/* Re-filter on hash change (nav click) without re-fetching */
window.addEventListener('hashchange', () => {
    /* scroll to top of match list */
    const el = document.getElementById('GelecekMaclar');
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    seRenderMatches();
});

/* Also intercept nav clicks to prevent default anchor jump when matches are above */
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.primary-links a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            const hash = a.getAttribute('href');
            history.pushState(null, '', hash);
            window.dispatchEvent(new HashChangeEvent('hashchange'));
        });
        });
    });

seFetchAll();
setInterval(seFetchAll, 180000);
</script>
